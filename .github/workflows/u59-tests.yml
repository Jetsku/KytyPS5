name: U59 tests

# Builds the emulator and the tests that need no GPU on every push to main and on pull requests, and runs them.
# GitHub's runners have no Vulkan device, so the GPU tests (shader_recompiler_compute and the cache/renderer
# suites, and kernel_file_system, which opens a hidden Vulkan window) run only locally before releases. No PGO and no IPO: this checks compilation and logic, not speed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $portHash = (Get-FileHash "$vcpkgRoot\ports\glslang\vcpkg.json" -Algorithm SHA256).Hash
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "port_hash=$($portHash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache glslang
        id: glslang_cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}\installed\x64-windows
          key: glslang-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.port_hash }}-tools-opt

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = "${{ steps.vcpkg.outputs.root }}"
          if ("${{ steps.glslang_cache.outputs.cache-hit }}" -ne "true") {
            vcpkg install glslang[tools,opt]:x64-windows
          }
          "$vcpkgRoot\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install LLVM 22.1.3
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.3-win64.exe'
          Invoke-WebRequest -Uri 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.3/LLVM-22.1.3-win64.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/S', '/D=C:\LLVM-22.1.3' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "LLVM installer exited with $($process.ExitCode)" }

      - name: Configure
        shell: cmd
        run: |
          set LLVM=C:/LLVM-22.1.3/bin
          cmake -S . -B _Build/tests -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DKYTY_EMULATOR_IPO=OFF ^
            -DKYTY_BUILD_LAUNCHER=OFF ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=%GITHUB_REPOSITORY% ^
            -DCMAKE_C_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_CXX_COMPILER=%LLVM%/clang-cl.exe ^
            -DCMAKE_LINKER=%LLVM%/lld-link.exe ^
            -DCMAKE_AR=%LLVM%/llvm-lib.exe

      - name: Build
        shell: cmd
        run: |
          cmake --build _Build/tests --parallel --target kyty_emulator ^
            range_set_tests page_manager_tests memory_tracker_tests audio_out2_port_tests pad_haptics_tests controller_settings_tests ^
            ime_dialog_tests lru_cache_tests virtual_memory_allocation_tests resource_tracking_tests ^
            scalar_provenance_tests resource_materialization_tests shader_vertex_metadata_tests archive_file_tests ^
            avplayer_file_tests device_compat_tests shader_cfg_tests

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir _Build/tests --output-on-failure -R "^(range_set|page_manager|memory_tracker|audio_out2_port|pad_haptics|controller_settings|ime_dialog|lru_cache|virtual_memory_allocation.*|resource_tracking|scalar_provenance|resource_materialization|shader_vertex_metadata|archive_file|avplayer_file|device_compat|shader_cfg)$" 2>&1 | Tee-Object -FilePath ctest.log
          $code = $LASTEXITCODE
          # Job logs need a GitHub sign-in to read; annotations do not. Name each failed test and its error lines.
          foreach ($line in (Get-Content ctest.log | Select-String -Pattern '\((Failed|Timeout|Exception|SEGFAULT|Not Run)\)|\*\*\*(Failed|Exception)')) {
            Write-Host ('::error::' + "$($line.Line.Trim())".Replace('%', '%25'))
          }
          foreach ($line in (Get-Content ctest.log | Select-String -Pattern 'Fatal|Error:|FAILED|abort' | Select-Object -First 10)) {
            Write-Host ('::warning::' + "$($line.Line.Trim())".Replace('%', '%25'))
          }
          exit $code
